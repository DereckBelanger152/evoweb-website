<!doctype html>
<html lang="fr-CA" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://www.evoweb.ca/" />
    <link rel="icon" href="/logo.ico" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <!-- Colore la barre d'adresse du navigateur mobile aux couleurs du site
         plutôt que de laisser une bande blanche au-dessus d'une page sombre. -->
    <meta name="theme-color" content="#141316" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F6F8" media="(prefers-color-scheme: light)" />
    <title>Evoweb - Création de sites web sur mesure pour petites entreprises</title>
    <meta name="description" content="Evoweb crée des sites web modernes et personnalisés pour les petites entreprises, à prix fixe et sans agence à payer.">
    <meta property="og:title" content="Evoweb - Création de Sites Web Sur Mesure pour Petites Entreprises">
    <meta property="og:description" content="Je transforme vos idées en sites web modernes et personnalisés pour les petites entreprises, pour renforcer votre présence en ligne.">
    <!-- À REMPLACER AVANT L'ANNONCE : image d'aperçu de 1200 × 630 px en PNG
         ou JPG. Le logo carré de 256 px ci-dessous force les réseaux à
         afficher une vignette minuscule à côté du lien. Une fois le fichier
         déposé dans public/og-image.png, mettre à jour les quatre balises
         og:image* et passer twitter:card à « summary_large_image ». -->
    <meta property="og:image" content="https://www.evoweb.ca/logo-evoweb.webp" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="256" />
    <meta property="og:image:alt" content="Evoweb — création de sites web sur mesure" />
    <meta property="og:url" content="https://www.evoweb.ca/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:site_name" content="Evoweb" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Evoweb - Création de Sites Web Sur Mesure pour Petites Entreprises">
    <meta name="twitter:description" content="Je transforme vos idées en sites web modernes et personnalisés pour les petites entreprises, pour renforcer votre présence en ligne.">
    <meta name="twitter:image" content="https://www.evoweb.ca/logo-evoweb.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Evoweb",
        "url": "https://www.evoweb.ca/",
        "image": "https://www.evoweb.ca/logo-evoweb.webp",
        "description": "Evoweb crée des sites web modernes et personnalisés pour les petites entreprises, à prix fixe et sans agence à payer.",
        "areaServed": "QC",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Québec",
          "addressRegion": "QC",
          "addressCountry": "CA"
        },
        "founder": {
          "@type": "Person",
          "name": "Dereck Bélanger"
        }
      }
    </script>
  </head>
  
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
